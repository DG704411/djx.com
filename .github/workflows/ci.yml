name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 静态检查单独一个 job：它失败时测试照常跑，不会被一起跳过。
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版本写死：ruff 每个版本都会调整规则集，浮动版本会让 CI 某天突然变红。
      # 升级时先在本地跑 `ruff check .` 通过，再改这里和 pyproject 的 dev extra。
      - name: Install ruff
        run: python -m pip install "ruff==0.17.6"

      # --output-format=github 把违规直接标注到 PR/commit 的文件行上，
      # 不用点进日志就能看出是哪个文件哪一行。
      - name: Ruff check
        run: python -m ruff check . --output-format=github

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 stdout 默认是 cp1252，中文输出会抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -v

      - name: Smoke test - zero-dependency runner
        run: python -X utf8 tests/run_tests.py
